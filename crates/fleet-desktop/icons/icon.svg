<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- web/ui/public/icon.svg on the macOS icon grid: 824px rounded square, 100px margin -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c8693f"/>
      <stop offset="1" stop-color="#8a3c20"/>
    </linearGradient>
    <clipPath id="r"><rect width="512" height="512" rx="114"/></clipPath>
  </defs>
  <g transform="translate(100 100) scale(1.609375)" clip-path="url(#r)">
    <rect width="512" height="512" fill="url(#bg)"/>
  <!-- the lead ship -->
  <path transform="translate(256 236) scale(2.05)" d="M0 -78 L58 58 L0 30 L-58 58 Z" fill="#fffaf4"/>
  <!-- activity status dot -->
  <circle cx="256" cy="420" r="40" fill="#3a1d10"/>
  <circle cx="256" cy="420" r="27" fill="#a8d47f"/>
  </g>
</svg>
