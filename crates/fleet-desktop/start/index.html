<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fleet</title>
<style>
  :root { color-scheme: dark; --bg: #0b0c0e; --card: #161b22; --fg: #e9ecef; --dim: #8b949e; --accent: #7fb7ff; --bad: #ff7b72; }
  @media (prefers-color-scheme: light) {
    :root { color-scheme: light; --bg: #f6f7f9; --card: #fff; --fg: #1b1f24; --dim: #57606a; --accent: #0969da; --bad: #cf222e; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; display: grid; place-items: center; padding: 24px; }
  main { width: min(560px, 100%); background: var(--card); border-radius: 14px; padding: 28px; box-shadow: 0 1px 3px rgb(0 0 0 / .2); }
  h1 { font-size: 17px; margin: 0 0 4px; display: flex; align-items: center; gap: 10px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--dim); flex: none; }
  .dot.busy { background: var(--accent); animation: pulse 1s ease-in-out infinite; }
  .dot.bad { background: var(--bad); }
  @keyframes pulse { 50% { opacity: .3; } }
  p { margin: 8px 0; }
  .dim { color: var(--dim); }
  code, pre { font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
  pre { background: var(--bg); border-radius: 8px; padding: 10px 12px; overflow: auto; max-height: 220px; white-space: pre-wrap; word-break: break-word; }
  .row { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  button { font: inherit; border: 0; border-radius: 8px; padding: 7px 14px; cursor: pointer; background: var(--bg); color: var(--fg); }
  button.primary { background: var(--accent); color: #0b0c0e; font-weight: 600; }
  [hidden] { display: none !important; }
</style>
</head>
<body data-tauri-drag-region>
<main>
  <h1><span id="dot" class="dot busy"></span><span id="title">Connecting…</span></h1>
  <p id="where" class="dim"></p>
  <pre id="error" hidden></pre>
  <div id="help" hidden>
    <p>Start it in a terminal with <code>fleet web serve</code>, or keep it running with <code>fleet web install-service</code>. The app opens <code>desktop.url</code>, else <code>hosts.&lt;self&gt;.web</code>, else <code>http://127.0.0.1:&lt;web.port&gt;</code> from <code>~/.config/fleet/config.json</code>.</p>
  </div>
  <details id="logbox" hidden><summary class="dim">Server log</summary><pre id="log"></pre></details>
  <div class="row" id="actions" hidden>
    <button class="primary" id="retry">Retry</button>
    <button id="openlog" hidden>Open log</button>
  </div>
</main>
<script>
  const $ = (id) => document.getElementById(id)
  const invoke = (cmd, args) => window.__TAURI_INTERNALS__.invoke(cmd, args)
  let timer = null

  const TITLES = {
    ok: 'Opening Fleet…',
    starting: 'Starting fleet web serve…',
    down: 'Fleet server is not running',
    error: 'Fleet config problem',
  }

  function show(s) {
    const busy = s.state === 'ok' || s.state === 'starting'
    $('dot').className = 'dot ' + (busy ? 'busy' : 'bad')
    $('title').textContent = TITLES[s.state] || s.state
    $('where').textContent = s.url ? `${s.url} (${s.source})` : ''
    $('error').hidden = !s.error
    $('error').textContent = s.error || ''
    $('help').hidden = s.state !== 'down'
    $('actions').hidden = busy
    $('openlog').hidden = !s.logPath
    $('logbox').hidden = !s.log || s.state === 'ok'
    $('log').textContent = s.log || ''
  }

  async function run() {
    clearTimeout(timer)
    let s
    try {
      s = await invoke('connect')
    } catch (e) {
      s = { state: 'error', error: String(e) }
    }
    show(s)
    if (s.state === 'starting') timer = setTimeout(run, 700)
  }

  $('retry').onclick = () => {
    show({ state: 'starting' })
    $('title').textContent = 'Connecting…'
    run()
  }
  $('openlog').onclick = () => invoke('open_log')
  addEventListener('keydown', (e) => { if (e.key === 'Enter' && !$('actions').hidden) $('retry').click() })
  run()
</script>
</body>
</html>
